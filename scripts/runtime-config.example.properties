# Copy to .local/application.properties. Never commit the actual private file.
# Generate separate cryptographically random secrets, at least 32 bytes each.
XIAOZHI_PYTHON_SERVICE_KEY=
XIAOZHI_DEVICE_SERVICE_KEY=
XIAOZHI_MEMORY_SERVICE_KEY=
XIAOZHI_REMINDER_SERVICE_KEY=
XIAOZHI_MUSIC_SERVICE_KEY=
# Use a dedicated account scoped to the xiaozhi database, not root.
DB_USERNAME=
DB_PASSWORD=
# Rotate previously committed provider keys in their provider consoles first.
QWEATHER_API_KEY=
TAVILY_API_KEY=
XIAOZHI_CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
