spring:
  config:
    import: optional:file:../.local/application.properties,optional:file:.local/application.properties
  application:
    name: xiaozhi-java-server
  profiles:
    active: dev

  # MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/xiaozhi?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:xiaozhi}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis（可选，开发阶段可以不启动 Redis）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Server
server:
  port: 8000

# Logging
logging:
  level:
    com.xiaozhi: warn
    org.springframework.web.reactive: info
    com.baomidou.mybatisplus: warn
    org.apache.ibatis: warn

# 小智配置
xiaozhi:
  # WebSocket 配置（OTA 回应中告诉设备连哪里）
  websocket:
    path: /xiaozhi/v1/
    heartbeat-interval: 30

  # OTA 配置
  ota:
    base-url: http://localhost:8000
    timezone-offset: +8

  # Python AI Server 地址（Java 端通过此地址调用 Python 的控制/配置接口）
  python-server:
    base-url: http://localhost:8004
