name: Core checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: xiaozhi-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: xiaozhi-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -f xiaozhi-java-server/pom.xml test
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: xiaozhi-python-server/requirements-ci.txt
      - run: sudo apt-get update && sudo apt-get install -y libopus0 ffmpeg
      - run: pip install -r xiaozhi-python-server/requirements-ci.txt
      - run: python xiaozhi-python-server/scripts/test_core.py
      - run: python -m black --check xiaozhi-python-server/core/providers/memory/memory_v2 xiaozhi-python-server/core/reporting xiaozhi-python-server/core/conversation/engine.py xiaozhi-python-server/core/conversation/tool_coordinator.py
